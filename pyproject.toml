[project]
name = "weather-ai-agent-service"
version = "0.2.1"
description = "Production-grade AI agent for weather queries with LangChain, LangGraph, and dual MCP servers"
authors = [
    {name = "Kumaran Iyyasamy Srinivasan"}
]
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}

dependencies = [
    # Core LangChain v1.1.x ecosystem
    "langchain>=1.1.0,<2.0.0",
    "langchain-core>=1.1.0,<2.0.0",
    "langchain-openai>=1.1.0,<2.0.0",
    "langchain-anthropic>=1.2.0,<2.0.0",
    "langchain-community>=0.3.27,<1.0.0",
    "langchain-text-splitters>=0.3.5,<1.0.0",
    # LangGraph v1.0.x - Modern agent runtime
    "langgraph>=1.0.4,<2.0.0",
    "langgraph-checkpoint>=3.0.1,<4.0.0",
    "langgraph-sdk>=0.2.10,<1.0.0",
    # LangGraph checkpointers (production databases)
    "langgraph-checkpoint-postgres>=3.0.1,<4.0.0",
    "psycopg>=3.2.0,<4.0.0",
    "psycopg-pool>=3.2.0,<4.0.0",
    "langgraph-checkpoint-sqlite>=2.0.6,<3.0.0",
    # Vector stores & embeddings (Qdrant for RAG)
    "langchain-qdrant>=1.0.0",
    "qdrant-client>=1.11.0,<2.0.0",
    # LLM providers
    "openai>=2.8.1,<3.0.0",
    "anthropic>=0.42.0,<1.0.0",
    # Utilities
    "python-dotenv>=1.0.1,<2.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "httpx>=0.28.1,<1.0.0",
    # Logging & observability
    "structlog>=25.5.0",
    "langsmith>=0.4.49,<1.0.0",
    # Production API (FastAPI)
    "fastapi>=0.123.0,<1.0.0",
    "uvicorn[standard]>=0.38.0,<1.0.0",
    # In-memory and persistent storage
    "redis>=7.1.0,<8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.15.0",
    "black>=24.12.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "ipython>=8.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_agent"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.flake8-import-conventions.banned-from]
# Ban deprecated LangChain imports
"langgraph.prebuilt" = [
    "create_react_agent",  # Deprecated in v1.0+ - use langchain.agents.create_agent
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
# Coverage options temporarily disabled for testing
# addopts = "-v --cov=backend --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"
