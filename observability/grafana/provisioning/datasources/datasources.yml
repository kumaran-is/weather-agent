# ============================================================================
# Grafana Data Sources - Weather AI Agent Service (Level 5c)
# ============================================================================
# Auto-provisioned data sources for Grafana
#
# Data Sources:
#   - Prometheus: Metrics (MCP, cache, agent, system)
#   - Loki: Logs (centralized log aggregation)
#
# Note: LangSmith is used separately for AI/LLM-specific tracing
# ============================================================================

apiVersion: 1

datasources:
  # =========================================================================
  # Prometheus - Primary metrics source
  # =========================================================================
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 2.47.0
      timeInterval: "15s"
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: loki

  # =========================================================================
  # Loki - Log aggregation
  # =========================================================================
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        # Extract trace_id from logs for correlation
        - datasourceUid: prometheus
          matcherRegex: "trace_id=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"
