# ============================================================================
# Service Access URLs (Level 8 - Full Production Platform with Signal Correlation)
# ============================================================================
# After starting with `docker-compose up -d`:
#
# Core Services:
# - Weather AI API:      http://localhost:8000/docs (Swagger UI)
# - Weather MCP:         http://localhost:8080/health
# - Hurricane MCP:       http://localhost:8081/health
#
# Databases:
# - Qdrant Dashboard:    http://localhost:6333/dashboard
# - Neo4j Browser:       http://localhost:7474 (user: neo4j, pass: weatherai2025)
# - PostgreSQL:          postgresql://weather_ai:weatherai2025@localhost:5432/weather_ai
# - Redis CLI:           docker exec -it weather-ai-redis redis-cli
#
# Observability (Level 5c + Level 8 Signal Correlation):
# - Grafana:             http://localhost:3001 (user: admin, pass: weatherai2025)
# - Prometheus:          http://localhost:9090 (with exemplar storage)
# - Tempo:               http://localhost:3200 (trace visualization via Grafana)
# - Loki:                http://localhost:3100 (accessed via Grafana)
#
# Signal Correlation (Level 8):
# - Metrics → Traces:    Click ⭐ exemplars on histogram panels in Grafana
# - Traces → Logs:       View "Logs" tab in Tempo trace view
# - Logs → Traces:       Click trace_id links in Loki log entries
# - Traces → Metrics:    View "Metrics" tab in Tempo trace view
#
# Quick Commands:
# - Start all:           make docker-up
# - Stop all:            make docker-down
# - View logs:           make docker-logs
# - Check health:        make docker-health
# - View metrics:        make observability-status
# - Open Grafana:        make grafana-open
