# ============================================================================
# Weather AI Agent Service - Docker Compose (PRODUCTION)
# ============================================================================
# This file orchestrates all services required for the Weather AI Agent.
#
# LEVEL 9 (Current): Semantic Caching with Two-Tier Architecture
#   - Weather MCP Server (port 8080)
#   - Hurricane Tracker MCP (port 8081)
#   - Weather AI Agent API (port 8000)
#   - Qdrant Vector Database (port 6333) - Level 2 + Level 9 (semantic cache)
#   - Redis (port 6379) - Level 3a + Level 9 (exact match cache)
#   - Neo4j (ports 7474, 7687) - Level 3a (long-term memory via Graphiti)
#   - PostgreSQL (port 5432) - Level 3c (procedural memory)
#   - Tempo (port 3200, OTLP 4317) - Level 8 (distributed tracing)
#   - Prometheus (port 9090) - Level 5c/9c (metrics + cache metrics)
#   - Grafana (port 3001) - Level 5c/8/9c (dashboards + cache dashboards)
#   - Loki (port 3100) - Level 5c (log aggregation)
#
# Level 9 Semantic Caching:
#   - Q1: In-memory LRU cache (user-specific, <1ms)
#   - Q2: Redis exact match (shared, <10ms)
#   - Q3: Qdrant semantic cache (similarity matching, <50ms)
#   - Tool cache: T1 (Redis) + T2 (Qdrant semantic)
#   - LLM cache: R1 (Redis) + R2 (Qdrant semantic)
#
# Signal Correlation (Level 8):
#   - Metrics → Traces: Exemplars with trace_id (Prometheus → Tempo)
#   - Traces → Metrics: tracesToMetrics queries (Tempo → Prometheus)
#   - Logs → Traces: Derived fields with trace_id regex (Loki → Tempo)
#   - Traces → Logs: tracesToLogsV2 query (Tempo → Loki)
#
# Run with: docker-compose up -d
# Stop with: docker-compose down
# ============================================================================

services:
  # ==========================================================================
  # Weather MCP Server (Port 8080)
  # ==========================================================================
  weather-mcp:
    build:
      context: ../mcp-weather-server
      dockerfile: Dockerfile
    container_name: weather-mcp-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - LOG_LEVEL=${WEATHER_LOG_LEVEL:-info}
      # Connection pool optimization (Option 2)
      - KEEP_ALIVE_TIMEOUT=30000  # 30s (reduced from 60s to prevent "other side closed")
      - MAX_RETRY_DELAY=5000  # 5s (reduced from 10s to prevent retry cascades)
      - POOL_CONNECTIONS=20  # Reduced from 50 to avoid rate limits
      - BASE_RETRY_DELAY=500  # 500ms (reduced from 1s for faster retries)
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => {r.statusCode === 200 ? process.exit(0) : process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mcp-network
    volumes:
      # Optional: Mount logs directory
      - weather-logs:/app/logs

  # ==========================================================================
  # Hurricane Tracker MCP (Port 8081)
  # ==========================================================================
  hurricane-mcp:
    build:
      context: ../hurricane-tracker-mcp
      dockerfile: Dockerfile
      target: production
    container_name: hurricane-tracker-mcp
    restart: unless-stopped
    ports:
      - "8081:8080"  # Map host 8081 to container 8080
      # - "9090:9090"  # Metrics port (Optional - Uncomment for Prometheus/Grafana monitoring)
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - MCP_TRANSPORT=http
      - HTTP_PORT=8080
      - HTTP_HOST=0.0.0.0
      - LOG_LEVEL=${HURRICANE_LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - PRETTY_LOGS=false
      # Cache configuration
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE:-1000}
      - CACHE_CURRENT_HURRICANES_TTL=${CACHE_CURRENT_HURRICANES_TTL:-300000}
      - CACHE_FORECAST_TTL=${CACHE_FORECAST_TTL:-900000}
      - CACHE_ALERT_TTL=${CACHE_ALERT_TTL:-120000}
      - CACHE_TRACK_TTL=${CACHE_TRACK_TTL:-600000}
      - CACHE_HISTORICAL_TTL=${CACHE_HISTORICAL_TTL:-86400000}
      # Timeouts
      - REQUEST_TIMEOUT_MS=${REQUEST_TIMEOUT_MS:-30000}
      - CONNECTION_TIMEOUT_MS=${CONNECTION_TIMEOUT_MS:-10000}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      # Security
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_PER_CLIENT=${RATE_LIMIT_PER_CLIENT:-100}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => {r.statusCode === 200 ? process.exit(0) : process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mcp-network
    volumes:
      # Optional: Mount logs directory
      - hurricane-logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ==========================================================================
  # Qdrant Vector Database (Port 6333) - Level 2 + Level 9 Semantic Cache
  # ==========================================================================
  # Level 2: RAG document embeddings
  # Level 9: Semantic query cache (Q3), tool cache (T2), LLM cache (R2)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: weather-ai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API (optional)
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - mcp-network
    # Note: Health check disabled - Qdrant container doesn't have wget/curl
    # Qdrant starts reliably and weather-ai-api will retry on connection failure
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ==========================================================================
  # Redis (Port 6379) - Level 3a + Level 9: Short-Term Memory & Exact Cache
  # ==========================================================================
  # Level 3a: Short-term conversation memory
  # Level 9: Exact match cache (Q2/L2, T1 tool cache, R1 LLM cache)
  redis:
    image: redis:8.4.0-alpine
    container_name: weather-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ==========================================================================
  # Neo4j (Ports 7474, 7687) - Level 3a: Long-Term Memory (Graphiti)
  # ==========================================================================
  neo4j:
    image: neo4j:5.26.0
    container_name: weather-ai-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP (Neo4j Browser)
      - "7687:7687"  # Bolt (Graphiti connection)
    environment:
      - NEO4J_AUTH=neo4j/${GRAPHITI_PASSWORD:-weatherai2025}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      # Memory configuration to fit within Docker resource limits
      - NEO4J_server_memory_heap_initial__size=128m
      - NEO4J_server_memory_heap_max__size=256m
      - NEO4J_server_memory_pagecache_size=128m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${GRAPHITI_PASSWORD:-weatherai2025}", "RETURN 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ==========================================================================
  # PostgreSQL (Port 5432) - Level 3c: Procedural & Reflective Memory
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: weather-ai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=weather_ai
      - POSTGRES_USER=weather_ai
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-weatherai2025}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=C
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weather_ai -d weather_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ==========================================================================
  # Weather AI Agent API (Port 8000) - Level 3a
  # ==========================================================================
  weather-ai-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: weather-ai-api
    restart: unless-stopped
    env_file:
      - .env  # Explicitly load .env file for LangSmith and API keys
    ports:
      - "8000:8000"
    environment:
      # LLM API Keys (from host .env)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      # Optional: Anthropic for future levels
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # MCP Server URLs (Docker network internal DNS - ALWAYS use service names in containers)
      - MCP_WEATHER_SERVER_URL=http://weather-mcp:8080
      - MCP_HURRICANE_SERVER_URL=http://hurricane-mcp:8080
      - MCP_WEATHER_SERVER_ENABLED=${MCP_WEATHER_SERVER_ENABLED:-true}
      - MCP_HURRICANE_SERVER_ENABLED=${MCP_HURRICANE_SERVER_ENABLED:-true}
      # MCP Resilience Patterns (Level 7 - Critical Gap #1)
      - MCP_WEATHER_REQUEST_TIMEOUT=90
      # Qdrant Vector Database (Level 2 - RAG)
      - QDRANT_URL=http://qdrant:6333
      # Redis (Level 3a - Short-Term Memory - ALWAYS use service name in containers)
      - REDIS_URL=redis://redis:6379/0
      - REDIS_TTL_SECONDS=${REDIS_TTL_SECONDS:-1800}
      - REDIS_MAX_CONNECTIONS=${REDIS_MAX_CONNECTIONS:-50}
      - REDIS_MAX_CONVERSATION_TURNS=${REDIS_MAX_CONVERSATION_TURNS:-10}
      # L2 Cache (Redis Distributed Cache - ALWAYS use service name in containers)
      - L2_CACHE_REDIS_URL=redis://redis:6379/0
      # Level 9 Semantic Cache Configuration
      - SEMANTIC_CACHE_ENABLED=${SEMANTIC_CACHE_ENABLED:-true}
      - SEMANTIC_CACHE_THRESHOLD=${SEMANTIC_CACHE_THRESHOLD:-0.85}
      - SEMANTIC_CACHE_TTL=${SEMANTIC_CACHE_TTL:-1800}
      - TOOL_CACHE_ENABLED=${TOOL_CACHE_ENABLED:-true}
      - LLM_CACHE_ENABLED=${LLM_CACHE_ENABLED:-true}
      - CACHE_METRICS_ENABLED=${CACHE_METRICS_ENABLED:-true}
      # Neo4j/Graphiti (Level 3a - Long-Term Memory - ALWAYS use service name in containers)
      - GRAPHITI_URL=bolt://neo4j:7687
      - GRAPHITI_USER=${GRAPHITI_USER:-neo4j}
      - GRAPHITI_PASSWORD=${GRAPHITI_PASSWORD:-weatherai2025}
      - GRAPHITI_DATABASE=${GRAPHITI_DATABASE:-weather_ai}
      # Neo4j health check (used by settings.py)
      - NEO4J_BOLT_URL=bolt://neo4j:7687
      - NEO4J_USER=${GRAPHITI_USER:-neo4j}
      - NEO4J_PASSWORD=${GRAPHITI_PASSWORD:-weatherai2025}
      # PostgreSQL (Level 3c - Procedural & Reflective Memory)
      - POSTGRES_URL=postgresql://weather_ai:${POSTGRES_PASSWORD:-weatherai2025}@postgres:5432/weather_ai
      - POSTGRES_MAX_CONNECTIONS=${POSTGRES_MAX_CONNECTIONS:-20}
      # Memory System (Level 3a)
      - ENABLE_MEMORY=${ENABLE_MEMORY:-true}
      - ENABLE_USER_PROFILES=${ENABLE_USER_PROFILES:-true}
      - ENABLE_ENTITY_TRACKING=${ENABLE_ENTITY_TRACKING:-true}
      - ENABLE_PRONOUN_RESOLUTION=${ENABLE_PRONOUN_RESOLUTION:-true}
      # Application settings
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      # Observability (Level 5c - Prometheus, Grafana, Loki)
      - PROMETHEUS_URL=http://prometheus:9090
      - GRAFANA_URL=http://grafana:3000
      - LOKI_URL=http://loki:3100
      # LangSmith tracing
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_ENDPOINT=${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-weather-ai-agent-dev-l3a}
      # OpenTelemetry - Tempo (Level 8: Signal Correlation)
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - OTEL_TRACES_ENABLED=true
      - OTEL_SERVICE_NAME=weather-ai-agent
    depends_on:
      weather-mcp:
        condition: service_started
      hurricane-mcp:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - mcp-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

# ==========================================================================
  # Tempo (Port 3200) - Level 8: Distributed Tracing
  # ==========================================================================
  # Grafana Tempo for trace storage and signal correlation
  # Receives traces via OTLP (gRPC:4317, HTTP:4318)
  # Signal Correlation:
  #   - Traces → Logs: tracesToLogsV2 (Tempo → Loki)
  #   - Traces → Metrics: tracesToMetrics (Tempo → Prometheus)
  #   - Metrics → Traces: Exemplars (Prometheus → Tempo)
  #   - Logs → Traces: Derived fields (Loki → Tempo)
  # ==========================================================================
  tempo:
    image: grafana/tempo:2.3.1
    container_name: weather-ai-tempo
    restart: unless-stopped
    ports:
      - "3200:3200"   # Tempo HTTP API (for Grafana)
      - "4317:4317"   # OTLP gRPC receiver (for OTel SDK)
      - "4318:4318"   # OTLP HTTP receiver (alternative)
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ==========================================================================
  # Prometheus (Port 9090) - Level 5c: Metrics Collection
  # ==========================================================================
  # Updated for Level 8: Exemplar storage enabled for trace correlation
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: weather-ai-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=15d'
      # Level 8: Enable exemplar storage for metrics→traces correlation
      - '--enable-feature=exemplar-storage'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - mcp-network
    depends_on:
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ==========================================================================
  # Grafana (Port 3001) - Level 5c: Dashboards & Visualization
  # ==========================================================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: weather-ai-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"  # Map to 3001 to avoid conflicts with common dev servers
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-weatherai2025}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_LOG_LEVEL=info
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - mcp-network
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ==========================================================================
  # Loki (Port 3100) - Level 5c: Log Aggregation
  # ==========================================================================
  loki:
    image: grafana/loki:2.9.2
    container_name: weather-ai-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

# ============================================================================
# Networks
# ============================================================================
networks:
  mcp-network:
    driver: bridge
    name: weather-ai-mcp-network

# ============================================================================
# Volumes (Level 5c: Full Production Platform)
# ============================================================================
volumes:
  weather-logs:
    name: weather-mcp-logs
  hurricane-logs:
    name: hurricane-mcp-logs
  qdrant-data:
    name: weather-ai-qdrant-data  # Level 2 - Qdrant vector storage
  redis-data:
    name: weather-ai-redis-data  # Level 3a - Redis short-term memory + L2 cache
  neo4j-data:
    name: weather-ai-neo4j-data  # Level 3a - Neo4j graph database
  neo4j-logs:
    name: weather-ai-neo4j-logs  # Level 3a - Neo4j logs
  postgres-data:
    name: weather-ai-postgres-data  # Level 3c - PostgreSQL procedural/reflective memory
  prometheus-data:
    name: weather-ai-prometheus-data  # Level 5c - Prometheus metrics storage
  grafana-data:
    name: weather-ai-grafana-data  # Level 5c - Grafana dashboards & settings
  loki-data:
    name: weather-ai-loki-data  # Level 5c - Loki log storage
  tempo-data:
    name: weather-ai-tempo-data  # Level 8 - Tempo trace storage

