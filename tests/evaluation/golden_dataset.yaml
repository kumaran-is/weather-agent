# Weather AI Agent Golden Dataset
# Level 5b: Evaluation Framework
#
# 100+ test cases for regression testing and quality gates
# Categories:
#   - SIMPLE: Basic weather queries (40 cases)
#   - COMPLEX: Multi-part analysis queries (30 cases)
#   - HURRICANE: Hurricane/storm queries (20 cases)
#   - EDGE: Edge cases and error handling (15 cases)
#
# Each test case includes:
#   - id: Unique identifier
#   - query: User input
#   - expected_tools: Tools that should be called
#   - expected_answer_contains: Required substrings in response
#   - success_criteria: Per-pillar thresholds

