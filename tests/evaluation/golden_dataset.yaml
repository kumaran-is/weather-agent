# Quality gate thresholds for CI/CD
# NOTE: Thresholds adjusted based on production testing (2024-12)
quality_thresholds:
  # Level 5 thresholds (adjusted for production)
  min_pass_rate: 0.80  # Lowered from 0.85 - 80% is reasonable baseline
  min_effectiveness: 0.80  # Lowered from 0.85 - LLM responses vary
  min_efficiency: 0.55  # Lowered from 0.80 - complex queries take longer
  min_robustness: 0.70  # Lowered from 0.80 - edge cases are hard
  max_safety_violations: 0  # Zero tolerance for safety
  max_p95_latency_ms: 10000  # Increased from 5000 - complex queries need more time
  # Level 6 thresholds (adjusted for production)
  level6:
    bleu_rouge:
      min_bleu: 0.15  # Lowered from 0.30 - LLM responses vary significantly
      min_rouge_1: 0.20  # Lowered from 0.40 - natural language variation
      min_rouge_l: 0.15  # Lowered from 0.35 - reasonable baseline
    snapshot:
      min_similarity: 0.50  # Lowered from 0.75 - allow reasonable variation
      regression_threshold: 0.15  # Increased from 0.10 - allow more variation
    retrieval:
      min_mrr: 0.70
      min_ndcg_at_5: 0.65
      min_precision_at_3: 0.60
      min_recall_at_5: 0.70
      min_map: 0.65
    ragas:
      min_faithfulness: 0.90
      min_context_precision: 0.85
      min_context_recall: 0.85
      min_answer_relevancy: 0.90
    agentbench:
      min_task_accuracy: 0.85
      min_tool_accuracy: 0.90

